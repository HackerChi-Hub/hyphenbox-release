name: 下载主页长期内容检查
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/readme-contract.mjs
